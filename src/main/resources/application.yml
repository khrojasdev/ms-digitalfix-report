spring:
  application:
    name: ms-digitalfix-report
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:DFX_REPORT}
    password: ${ORACLE_REPORT_PASSWORD:digitalfix}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: report-pool
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Confirmacion manual (ACK/NACK la decide ProcesadorDeMensajes)
        acknowledge-mode: manual
        default-requeue-rejected: false # un NACK va a la DLQ, nunca se reencola en bucle

# EXIGENCIA DE RÚBRICA: Nombres centralizados
amqp:
  exchange:
    negocio: ordenes.negocio.exchange
  queue:
    reportes: ordenes.reportes.queue
    reportes-dlq: ordenes.reportes.dlq
  routing-key:
    reportes: ordenes.eventos.*
  # Fallas transitorias (base de datos o red): cuantas veces se intenta y la
  # espera inicial, que se duplica en cada intento. Ver ProcesadorDeMensajes.
  reintentos:
    maximo: 3
    espera-ms: 1000

server:
  port: ${PUERTO:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlacion:-sin-correlacion}] %logger{36} - %msg%n"